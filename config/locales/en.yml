# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  controllers:
    shared:
      rate_limited: "Try again later."
    notifications:
      all_marked_read: "All notifications marked as read."
    passwords:
      reset_requested: "Password reset instructions sent (if user with that email address exists)."
      reset: "Password has been reset."
      password_mismatch: "Passwords did not match."
      invalid_reset_link: "Password reset link is invalid or has expired."
    registrations:
      created: "Welcome! Your account has been created."
    sessions:
      invalid_credentials: "Try another email address or password."
    settings:
      profile_updated: "Profile updated successfully."
      study_preferences_saved: "Settings saved."
    study_plans:
      created: "Study plan created successfully."
      updated: "Study plan updated successfully."
      deleted: "Study plan deleted successfully."
    study_sessions:
      created: "Study session created successfully."
      updated: "Study session updated successfully."
      completed: "Study session completed successfully."
      deleted: "Study session deleted successfully."
    topics:
      created: "Topic created successfully."
      updated: "Topic updated successfully."
      deleted: "Topic deleted successfully."
  models:
    study_session:
      errors:
        already_active: "There is already an active study session for this topic."
    notifications:
      daily_reminder:
        title: "Daily Reminder"
        content: "Don't forget to check your study plan today!\nYou have %{study_plan_count} study plans.\nAnd %{active_session_count} active sessions."
    reports:
      weekly_progress:
        name: "Weekly Progress"
        columns:
          - "completed"
          - "started"
          - "started_and_completed_this_week"
  mailers:
    passwords:
      reset:
        subject: "Reset your password"
        link_text: "this password reset page"
        instructions_html: "You can reset your password on %{reset_link}. This link will expire in %{expiration}."
        instructions_text: "You can reset your password on %{reset_url}. This link will expire in %{expiration}."
    user:
      report_email:
        subject: "Your Weekly Progress Report is Ready"
        greeting: "Hello,"
        attachment_message: "Please find the attached report:"
